schema_version: "1.0"
name: review-flags-dense-code
description: A correct change with low cyclomatic complexity that is still hard to read (ternary chains choosing control flow, pairs travelling through a pipeline, magic numbers, a table test built from tuples) is blocked by the review on readability.
tags: [review, clean-code, headless]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /ravend:review cart-coupon --headless
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Agent]
  env:
    EVAL_RAVEND_HOME: .ravend-home
runs: 1
graders:
  - type: tool_used
    name: dispatched-reviewer-agent
    tool: Agent
    input_match: "reviewer"
    min: 1
  - type: regex
    name: changes-requested
    pattern: '"verdict"\s*:\s*"CHANGES_REQUESTED"'
  - type: file_exists
    name: review-file-written
    path: .ravend-home/projects/example.com-acme-shop/specs/cart-coupon/review-1.md
  - type: llm
    name: flags-dense-code
    focus:
      source: file
      path: .ravend-home/projects/example.com-acme-shop/specs/cart-coupon/review-1.md
    criteria: >-
      The review has at least one P1 on src/cart.js about readability/maintainability, and together its findings cover
      at least three of: (1) the nested ternary chain in total() choosing control flow (including the IIFE that
      throws) instead of guard clauses; (2) the [gross, eligible] pair carried through a pipeline instead of named
      values or helpers; (3) the magic numbers 10000, 90 and 100 instead of named constants; (4) the subtotal
      reduce duplicated instead of extracted into a named helper; (5) the test building a table from nested arrays
      and asserting inside forEach instead of readable cases. It does not claim a correctness bug in the discount
      (the >= 10000 boundary and rounding are correct and tested).
