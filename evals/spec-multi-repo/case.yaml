schema_version: "1.0"
name: spec-multi-repo
description: A demand that needs a change in a sibling library (../pricing, with its own Ravend profile) must produce one multi-repo spec — `repos:` in the frontmatter and the library task tagged `repo:` and ordered before the task that uses it.
tags: [spec, multi-repo, headless]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /ravend:spec --headless Prices must support a per-customer discount: add the discount rule to the pricing
    library (../pricing) and apply it in the shop's cart total.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_RAVEND_HOME: .ravend-home
runs: 1
graders:
  - type: regex
    name: headless-json
    pattern: '"slug"\s*:'
  - type: tool_used
    name: no-questions-in-headless
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: spec-written-locally
    path: .ravend-home/projects/example.com-acme-shop/specs/*/spec.md
  - type: llm
    name: multi-repo-spec
    focus: trace
    criteria: >-
      The spec.md the agent wrote (Write tool call under .ravend-home/projects/*/specs/) has `repos: ../pricing`
      in the frontmatter; at least one task is tagged `repo: pricing` with files relative to that library
      (e.g. src/...), and the shop task that applies the discount lists that library task in its `deps`.
      No task edits the library without `repo: pricing`, and nothing was written inside either repository.
