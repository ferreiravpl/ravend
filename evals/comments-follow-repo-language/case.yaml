schema_version: "1.0"
name: comments-follow-repo-language
description: When the repository's AGENTS.md requires English comments, build writes comments in English while still talking to the developer in pt-BR.
tags: [build, language, headless]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /ravend:build cart-coupon --headless --approved
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_RAVEND_HOME: .ravend-home
runs: 1
graders:
  - type: regex
    name: headless-json
    pattern: '"status"\s*:\s*"(done|blocked)"'
  - type: llm
    name: comments-in-english
    focus:
      source: file
      path: src/cart.js
    criteria: >-
      src/cart.js implements the SAVE10 coupon (an optional coupon parameter on total). Every comment and doc comment
      in the file is written in English — none in Portuguese — and none mentions the delivery process (task ids such
      as T1, the spec slug, review rounds or acceptance-criterion numbers). A file with no new comments passes this
      criterion as long as the coupon is implemented.
  - type: llm
    name: talks-pt-br
    criteria: >-
      The "summary" field of the final headless JSON is written in Brazilian Portuguese.
